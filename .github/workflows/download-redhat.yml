
name: Download Red Hat UBI9 TAR

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Pull Red Hat UBI9
        run: |
          docker pull --platform linux/amd64 redhat/ubi9:latest

      - name: Convert Docker Image to TAR
        run: |
          docker save -o redhat-ubi9-amd64.tar redhat/ubi9:latest
          sha256sum redhat-ubi9-amd64.tar > redhat-ubi9-amd64.tar.sha256

      - name: Publish downloadable TAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "ubi9-${GITHUB_RUN_ID}" \
            redhat-ubi9-amd64.tar \
            redhat-ubi9-amd64.tar.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Red Hat UBI9 Docker Image" \
            --notes "Linux AMD64 Docker image for docker load"
